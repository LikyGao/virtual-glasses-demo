<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 140" width="400" height="140">
  <!-- 透明框眼镜：粗镜框，但材质半透明，靠高光和暗边表现厚度 -->
  <defs>
    <linearGradient id="acetate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#DCE3EA" stop-opacity="0.62" />
      <stop offset="100%" stop-color="#A9B4C0" stop-opacity="0.70" />
    </linearGradient>
    <linearGradient id="clearLens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16" />
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
  </defs>

  <g fill="none" stroke="url(#acetate)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <path d="M44 60 L8 50" />
    <path d="M356 60 L392 50" />
    <path d="M178 56 C193 46, 207 46, 222 56" />
  </g>

  <!-- 镜片轮廓：微微梯形的方圆框 -->
  <path d="M46 44 C46 34, 54 30, 78 30 L154 30 C174 30, 178 36, 178 48 C178 82, 164 108, 118 108 C72 108, 46 84, 46 44 Z"
        fill="url(#clearLens)" stroke="url(#acetate)" stroke-width="12" stroke-linejoin="round" />
  <path d="M354 44 C354 34, 346 30, 322 30 L246 30 C226 30, 222 36, 222 48 C222 82, 236 108, 282 108 C328 108, 354 84, 354 44 Z"
        fill="url(#clearLens)" stroke="url(#acetate)" stroke-width="12" stroke-linejoin="round" />

  <!-- 顶部高光，让透明框在深色背景上也能看见 -->
  <g stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M62 40 C70 34, 92 33, 120 33" />
    <path d="M338 40 C330 34, 308 33, 280 33" />
  </g>
</svg>
